name: Generate SEO metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/generate-seo.py', '.github/workflows/seo.yml']
permissions:
  contents: write
concurrency:
  group: poppoo-seo
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-seo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEO metadata"
            git push
          fi
